[project]
name = "spotify-to-ytmusic"
version = "0.1.0"
description = "Sync Spotify Exportify CSV playlists to YouTube Music preserving recency order"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ytmusicapi>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
s2yt = "spotify_to_ytmusic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_to_ytmusic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
